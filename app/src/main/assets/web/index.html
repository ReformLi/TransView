<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__DEVICE_NAME__ · 文件上传</title>
<!-- 浏览器标签页图标（favicon）：主选矢量 SVG，PNG 供不支持 SVG favicon 的浏览器兜底，
     apple-touch-icon 用于「添加到主屏幕」的图标 -->
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="alternate icon" type="image/png" sizes="192x192" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<style>
  :root {
    --bg: #0e1116;
    --surface: #161b22;
    --surface2: #232d3a;
    --primary: #4fc3f7;
    --on: #e8edf2;
    --dim: #9aa7b5;
    --ok: #7bd88f;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--on);
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  header { display: flex; align-items: center; gap: 10px; padding: 8px 0 20px; }
  /* 头部图标：与 favicon 同一套矢量图形（圆角方块 + 播放三角） */
  header .tv { width: 34px; height: 34px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  header .tv svg { display: block; width: 100%; height: 100%; }
  header .tv .bg { fill: var(--primary); }
  header .tv .fg { fill: #14213d; }
  header h1 { font-size: 20px; font-weight: 600; }
  header .badge {
    margin-left: auto; font-size: 12px; color: var(--ok);
    border: 1px solid var(--ok); border-radius: 20px; padding: 3px 10px;
  }
  header .badge.off { color: var(--err); border-color: var(--err); }

  .cats { display: flex; gap: 10px; margin-bottom: 10px; }
  .cat {
    flex: 1; padding: 12px 0; border-radius: 12px; border: 1px solid #2c3744;
    background: var(--surface); color: var(--dim);
    font-size: 15px; font-weight: 600; text-align: center;
    transition: all .15s; user-select: none;
  }
  .cat.active { background: var(--primary); color: #14213d; border-color: var(--primary); }
  .tip { font-size: 13px; color: var(--dim); margin-bottom: 16px; line-height: 1.6; }

  #dropzone {
    border: 2px dashed #37455a; border-radius: 16px;
    padding: 34px 16px; text-align: center;
    transition: all .15s;
  }
  #dropzone.drag { border-color: var(--primary); background: rgba(79,195,247,.08); }
  #dropzone .icon { font-size: 40px; line-height: 1; margin-bottom: 12px; }
  #dropzone p { color: var(--dim); font-size: 14px; margin-bottom: 18px; }
  .btns { display: flex; gap: 12px; justify-content: center; }
  .btn {
    padding: 12px 22px; border-radius: 12px; border: none;
    background: var(--surface2); color: var(--on);
    font-size: 15px; font-weight: 600;
  }
  .btn.primary { background: var(--primary); color: #14213d; }
  .btn:active { transform: scale(.96); }

  #queue { list-style: none; margin-top: 18px; }
  #queue li {
    background: var(--surface); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px;
  }
  .q-row { display: flex; align-items: center; gap: 10px; }
  .q-name {
    flex: 1; font-size: 14px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .q-size { font-size: 12px; color: var(--dim); flex-shrink: 0; }
  .q-state { font-size: 13px; flex-shrink: 0; min-width: 40px; text-align: right; }
  .q-state.wait { color: var(--dim); }
  .q-state.run  { color: var(--primary); }
  .q-state.ok   { color: var(--ok); }
  .q-state.err  { color: var(--err); }
  .q-state.cancel { color: var(--dim); }
  /* 每行的「取消 / 重试」按钮 */
  .q-act {
    flex-shrink: 0; font-size: 12px; font-weight: 600; line-height: 1;
    font-family: inherit; cursor: pointer;
    padding: 6px 11px; border-radius: 8px;
    border: 1px solid #37455a; background: transparent; color: var(--dim);
  }
  .q-act.retry { color: var(--primary); border-color: rgba(79,195,247,.55); }
  .q-act:active { background: var(--surface2); color: var(--on); }
  .bar { height: 4px; border-radius: 4px; background: #2c3744; margin-top: 10px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .15s; }
  .bar.ok > i { background: var(--ok); }
  .bar.err > i { background: var(--err); }
  .bar.cancel > i { background: #55606e; }

  .toast {
    position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%);
    background: #2c3744; color: var(--on); font-size: 13px;
    border-radius: 20px; padding: 9px 18px; max-width: 90vw;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ——— 访问码门槛（手动输入 IP 进入时显示，扫码进入不会看到） ——— */
  #gate { display: flex; align-items: center; justify-content: center; min-height: 62vh; }
  /* display:flex 会盖掉 [hidden] 的默认 display:none，必须显式补回来 */
  #gate[hidden], #app[hidden] { display: none !important; }
  .gate-card {
    width: 100%; background: var(--surface);
    border-radius: 16px; padding: 26px 20px 22px; text-align: center;
  }
  .gate-lock { font-size: 32px; line-height: 1; margin-bottom: 14px; }
  .gate-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .gate-sub { font-size: 13px; color: var(--dim); line-height: 1.6; margin-bottom: 18px; }
  #gate-input {
    width: 100%; text-align: center;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 26px; font-weight: 700;
    /* letter-spacing 会在最后一个字符**之后**也加一格，用等量 text-indent 抵消，视觉才居中 */
    letter-spacing: 6px; text-indent: 6px;
    padding: 13px 10px; border-radius: 12px;
    border: 1px solid #37455a; background: var(--bg); color: var(--on);
    outline: none; text-transform: uppercase;
  }
  #gate-input:focus { border-color: var(--primary); }
  #gate-input::placeholder {
    font-size: 14px; font-weight: 400; letter-spacing: 0; text-indent: 0; color: var(--dim);
  }
  #gate-submit { width: 100%; margin-top: 14px; padding: 14px 0; font-size: 16px; }
  #gate-submit[disabled] { opacity: .55; }
  .gate-err { margin-top: 12px; font-size: 13px; color: var(--err); line-height: 1.5; }
  .gate-err[hidden] { display: none; }

  footer { text-align: center; font-size: 12px; color: var(--dim); margin-top: 22px; }
</style>
</head>
<body>
<header>
  <div class="tv">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect class="bg" width="64" height="64" rx="15"/>
      <path class="fg" d="M23 17.5 L47 32 L23 46.5 Z"/>
    </svg>
  </div>
  <h1>__DEVICE_NAME__</h1>
  <div class="badge" id="badge">已连接</div>
</header>

<!-- 访问码门槛：URL 未带 token（手动输入 IP 进入）且本标签页尚未验证过时显示 -->
<section id="gate" hidden>
  <div class="gate-card">
    <div class="gate-lock">🔒</div>
    <div class="gate-title">请输入电视屏幕上显示的访问码</div>
    <div class="gate-sub">访问码显示在电视「上传」页二维码的下方，共 6 位（大写字母 + 数字）</div>
    <input id="gate-input" type="text" maxlength="6" inputmode="latin"
           autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"
           placeholder="6 位访问码">
    <button class="btn primary" id="gate-submit">确认</button>
    <div class="gate-err" id="gate-err" hidden></div>
  </div>
</section>

<!-- 上传界面：验证通过后才显示（initial hidden，避免门槛未过时闪一下上传界面） -->
<div id="app" hidden>
  <section class="cats" id="cats">
    <div class="cat active" data-cat="video">视频</div>
    <div class="cat" data-cat="image">图片</div>
    <div class="cat" data-cat="other">其他</div>
  </section>
  <p class="tip" id="tip"></p>

  <div id="dropzone">
    <div class="icon">📁</div>
    <p>点击选择文件，或将文件 / 文件夹拖拽到此处</p>
    <div class="btns">
      <button class="btn primary" id="pick-files">选择文件</button>
      <button class="btn" id="pick-folder">选择文件夹</button>
    </div>
    <input type="file" id="file-input" multiple hidden>
    <input type="file" id="folder-input" webkitdirectory multiple hidden>
  </div>

  <ul id="queue"></ul>
  <footer>上传完成后，可在电视端对应分类页面查看</footer>
</div>

<!-- toast 放在 #app 之外：访问码门槛界面也要能弹提示 -->
<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  var EXT = {
    video: ['mp4','mkv','avi','mov','flv','wmv','m4v','ts','webm','3gp','mpg','mpeg','rmvb','rm'],
    image: ['jpg','jpeg','png','gif','bmp','webp','heic','heif','tiff']
  };
  var TIPS = {
    video: '视频文件（mp4、mkv、avi 等）保存到电视「视频」分类；zip 压缩包会自动解压，只保留其中的视频',
    image: '图片文件（jpg、png、gif 等）保存到电视「图片」分类；zip 压缩包会自动解压，只保留其中的图片',
    other: '接受除视频、图片外的所有格式（apk、pdf、zip 等），zip 原样保存到「其他」分类，将通过电视系统工具打开'
  };

  var category = 'video';
  // status: wait（排队）/ run（上传中）/ ok / err（失败）/ cancel（已取消，可重试）
  // item.category 在入队时快照：用户排队后切换分类，不影响已入队文件按原分类上传
  var queue = [];        // {file, name, size, relPath, category, status, progress, xhr}
  var uploading = false;

  var $ = function (id) { return document.getElementById(id); };
  var queueEl = $('queue');
  var toastEl = $('toast');
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2600);
  }

  // ————————————————— 访问码（Token） —————————————————
  // 电视端访问码在 App 进程存活期内固定（熄屏/播放视频/休眠恢复都不换码，重启电视 App 才换新码）。
  // 手机侧只存 sessionStorage：同标签页刷新可复用，新开标签页（书签 / 直接输 IP）一律重新过门槛
  // —— 不做「记住访问码」。
  var TOKEN_KEY = 'uploadToken';
  var token = '';

  var gateEl = $('gate');
  var appEl = $('app');
  var gateInput = $('gate-input');
  var gateErr = $('gate-err');

  /** 统一按大写 + 只留字母数字（服务端字符集就是 A-Z + 0-9） */
  function normalizeToken(v) {
    return (v || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
  }

  function storeToken(v) {
    token = normalizeToken(v);
    try { sessionStorage.setItem(TOKEN_KEY, token); } catch (_) {}
  }

  function readStoredToken() {
    try { return normalizeToken(sessionStorage.getItem(TOKEN_KEY)); } catch (_) { return ''; }
  }

  function clearToken() {
    token = '';
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (_) {}
  }

  function setGateError(msg) {
    gateErr.textContent = msg || '';
    gateErr.hidden = !msg;
  }

  function showApp() {
    gateEl.hidden = true;
    appEl.hidden = false;
  }

  function showGate(msg) {
    appEl.hidden = true;
    gateEl.hidden = false;
    setGateError(msg || '');
    // 等一帧再聚焦，否则移动端软键盘弹不出来
    setTimeout(function () { try { gateInput.focus(); } catch (_) {} }, 60);
  }

  /** 点「确认」：先用 GET /verify 验一次，通过才放行（避免输错码要等上传才报错） */
  function submitGate() {
    var v = normalizeToken(gateInput.value);
    if (v.length !== 6) { setGateError('请输入 6 位访问码'); return; }
    var btn = $('gate-submit');
    btn.disabled = true;
    fetch('/verify?token=' + encodeURIComponent(v))
      .then(function (res) {
        btn.disabled = false;
        if (res.ok) {
          storeToken(v);
          gateInput.value = '';
          setGateError('');
          showApp();
          uploadNext();          // 之前因认证失效被暂停的队列继续跑
        } else {
          setGateError('访问码错误，请重试');
        }
      })
      .catch(function () {
        btn.disabled = false;
        setGateError('连接不上电视端，请确认电视「上传」页的服务器已启动');
      });
  }

  /** 访问码失效（服务器重启 / 休眠恢复后轮换）：清本地码、暂停队列、把用户送回门槛 */
  function authLost() {
    clearToken();
    gateInput.value = '';
    showGate('认证已失效，请重新输入电视屏幕上显示的访问码');
  }

  /** 上传中断后探一次 /verify：区分「访问码失效」与「真的连不上」。
   *  done = 当前这一轮的收尾回调（finishOne 定义在 uploadNext 内部，这里必须由调用方传进来） */
  function probeAuth(item, done) {
    var sent = token;
    fetch('/verify?token=' + encodeURIComponent(sent))
      .then(function (res) {
        if (res.ok) {
          toast('「' + item.name + '」上传中断，请重试');
        } else {
          authLost();
        }
        done();
      })
      .catch(function () {
        toast('连接失败：电视端服务器可能已休眠或正在播放视频，请在电视「上传」页唤醒/等待恢复后重试');
        done();
      });
  }

  $('gate-submit').addEventListener('click', submitGate);
  gateInput.addEventListener('input', function () {
    var v = normalizeToken(gateInput.value);
    if (v !== gateInput.value) gateInput.value = v;   // 自动转大写 + 剔除非法字符
  });
  gateInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submitGate(); }
  });

  function extOf(name) {
    var i = name.lastIndexOf('.');
    return i < 0 ? '' : name.slice(i + 1).toLowerCase();
  }

  function isAllowed(name) {
    var ext = extOf(name);
    // 压缩包在所有分类下都允许选择：视频/图片分类由电视端自动解压、
    // 只保留对应分类的文件；「其他」分类则原样保存
    if (ext === 'zip') return true;
    if (category === 'video') return EXT.video.indexOf(ext) >= 0;
    if (category === 'image') return EXT.image.indexOf(ext) >= 0;
    // 其他：接受非视频、非图片格式
    return EXT.video.indexOf(ext) < 0 && EXT.image.indexOf(ext) < 0;
  }

  // ——— 分类切换 ———
  var cats = document.querySelectorAll('.cat');
  cats.forEach(function (el) {
    el.addEventListener('click', function () {
      cats.forEach(function (c) { c.classList.remove('active'); });
      el.classList.add('active');
      category = el.dataset.cat;
      $('tip').textContent = TIPS[category];
    });
  });
  $('tip').textContent = TIPS[category];

  // ——— 文件选择 ———
  $('pick-files').addEventListener('click', function () { $('file-input').click(); });
  $('pick-folder').addEventListener('click', function () {
    if (!('webkitdirectory' in $('folder-input'))) {
      toast('当前浏览器不支持选择文件夹，请使用拖拽或压缩包');
      return;
    }
    $('folder-input').click();
  });

  $('file-input').addEventListener('change', function (e) {
    addFiles(sliceFileList(e.target.files), '');
    e.target.value = '';
  });
  $('folder-input').addEventListener('change', function (e) {
    // webkitRelativePath 形如 "剧集名/第一季/01.mp4"，完整保留文件夹结构
    var items = [];
    for (var i = 0; i < e.target.files.length; i++) {
      var f = e.target.files[i];
      items.push({ file: f, relPath: f.webkitRelativePath || '' });
    }
    addFiles(items, null);
    e.target.value = '';
  });

  function sliceFileList(list) {
    var items = [];
    for (var i = 0; i < list.length; i++) items.push({ file: list[i], relPath: '' });
    return items;
  }

  /** items: [{file, relPath}]；relPath 为空表示顶层文件。目录为 null 时表示已带 relPath */
  function addFiles(items, _unused) {
    var skipped = 0;
    items.forEach(function (it) {
      if (!isAllowed(it.file.name)) { skipped++; return; }
      queue.push({
        file: it.file,
        name: it.file.name,
        size: it.file.size,
        relPath: (it.relPath || '').replace(/\\/g, '/'),
        category: category,   // 入队时的分类快照，上传时以此为准
        status: 'wait',
        progress: 0
      });
    });
    if (skipped > 0) {
      toast('已忽略 ' + skipped + ' 个不符合「' + (category === 'video' ? '视频' : category === 'image' ? '图片' : '其他') + '」分类的文件');
    }
    render();
    uploadNext();
  }

  // ——— 拖拽上传 ———
  var dz = $('dropzone');
  ['dragenter', 'dragover'].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.add('drag'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    dz.addEventListener(ev, function (e) { e.preventDefault(); dz.classList.remove('drag'); });
  });
  dz.addEventListener('drop', function (e) {
    e.preventDefault();
    var items = e.dataTransfer.items;
    if (items && items.length && items[0].webkitGetAsEntry) {
      var entries = [];
      for (var i = 0; i < items.length; i++) {
        var entry = items[i].webkitGetAsEntry();
        if (entry) entries.push(entry);
      }
      collectEntries(entries, '').then(function (fileItems) {
        addFiles(fileItems, null);
      });
    } else {
      addFiles(sliceFileList(e.dataTransfer.files), '');
    }
  });

  /** 递归展开拖拽的文件/文件夹 */
  function collectEntries(entries, path) {
    var promises = entries.map(function (entry) {
      return new Promise(function (resolve) {
        if (entry.isFile) {
          entry.file(function (f) {
            resolve([{ file: f, relPath: path }]);
          }, function () { resolve([]); });
        } else if (entry.isDirectory) {
          var reader = entry.createReader();
          var all = [];
          var readBatch = function () {
            reader.readEntries(function (batch) {
              if (!batch.length) {
                collectEntries(all, path ? path + '/' + entry.name : entry.name).then(resolve);
              } else {
                all = all.concat(sliceArr(batch));
                readBatch(); // readEntries 每次最多返回 100 条
              }
            }, function () { resolve([]); });
          };
          readBatch();
        } else {
          resolve([]);
        }
      });
    });
    return Promise.all(promises).then(function (groups) {
      var result = [];
      groups.forEach(function (g) { result = result.concat(g); });
      return result;
    });
  }

  function sliceArr(arr) { return Array.prototype.slice.call(arr); }

  // ——— 上传 ———
  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + 'B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
    if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + 'MB';
    return (bytes / 1073741824).toFixed(2) + 'GB';
  }

  function render() {
    queueEl.innerHTML = '';
    queue.forEach(function (item, idx) {
      var li = document.createElement('li');

      var row = document.createElement('div');
      row.className = 'q-row';

      var name = document.createElement('span');
      name.className = 'q-name';
      name.textContent = item.relPath ? item.relPath + '/' + item.name : item.name;

      var size = document.createElement('span');
      size.className = 'q-size';
      size.textContent = fmtSize(item.size);

      var state = document.createElement('span');
      state.className = 'q-state ' + item.status;
      state.textContent =
        item.status === 'wait' ? '等待' :
        item.status === 'run' ? item.progress + '%' :
        item.status === 'ok' ? '成功' :
        item.status === 'cancel' ? '已取消' : '失败';

      row.appendChild(name);
      row.appendChild(size);
      row.appendChild(state);

      // 操作按钮：排队中 / 上传中 → 取消；失败 / 已取消 → 重试（不必重新选文件）
      var act = document.createElement('button');
      act.className = 'q-act';
      if (item.status === 'wait') {
        act.textContent = '取消';
        act.addEventListener('click', function () { dropItem(item); });
      } else if (item.status === 'run') {
        act.textContent = '取消';
        act.addEventListener('click', function () { cancelItem(item); });
      } else if (item.status === 'err' || item.status === 'cancel') {
        act.textContent = '重试';
        act.classList.add('retry');
        act.addEventListener('click', function () { retryItem(item); });
      } else {
        act.style.display = 'none';   // 已成功的项不需要操作
      }
      row.appendChild(act);

      var bar = document.createElement('div');
      bar.className = 'bar ' + (item.status === 'ok' ? 'ok' : item.status === 'err' ? 'err' : item.status === 'cancel' ? 'cancel' : '');
      var inner = document.createElement('i');
      inner.style.width = (item.status === 'ok' ? 100 : item.progress) + '%';
      bar.appendChild(inner);

      li.appendChild(row);
      li.appendChild(bar);
      queueEl.appendChild(li);
    });
  }

  // ——— 队列操作：取消 / 重试 ———

  /** 取消「排队中」的项：还没开始传，直接从队列移除 */
  function dropItem(item) {
    var i = queue.indexOf(item);
    if (i >= 0) queue.splice(i, 1);
    render();
  }

  /** 取消「上传中」的项：abort 掉 XHR，收尾交给 onabort 回调 */
  function cancelItem(item) {
    if (item.xhr) { item.xhr.abort(); return; }
    // 极端情况：请求已结束但状态没落（如恰好在回调间隙点击），直接标为已取消
    item.status = 'cancel';
    render();
  }

  /** 重试：把「失败 / 已取消」的项重新排队，沿用原文件与相对路径 */
  function retryItem(item) {
    if (item.status !== 'err' && item.status !== 'cancel') return;
    item.status = 'wait';
    item.progress = 0;
    // 插到「待上传区」最前面：批量上传时后面还排着一串文件，
    // 若只把状态改回 wait，用户点了重试要等前面全部传完才有反应
    var i = queue.indexOf(item);
    if (i >= 0) queue.splice(i, 1);
    var at = -1;
    for (var j = 0; j < queue.length; j++) {
      if (queue[j].status === 'wait') { at = j; break; }
    }
    if (at < 0) queue.push(item); else queue.splice(at, 0, item);
    render();
    uploadNext();
  }

  function uploadNext() {
    if (uploading) return;
    // 未认证时暂停队列：首次进入门槛、或收到 403 已清空访问码时，都在等用户重新输入。
    // 不 return 的话会把队列里剩下的文件一个个撞成 403，全被标成失败。
    if (!token) return;
    var item = null;
    for (var i = 0; i < queue.length; i++) {
      if (queue[i].status === 'wait') { item = queue[i]; break; }
    }
    if (!item) return;

    uploading = true;
    item.status = 'run';
    item.progress = 0;
    render();

    var form = new FormData();
    form.append('file', item.file, item.file.name);

    var xhr = new XMLHttpRequest();
    item.xhr = xhr;

    // 本轮结束收尾：幂等（abort 后个别浏览器会再补一个 error/load 回调，重复执行会并发跑起
    // 两个上传），且只认本轮 xhr（取消后重试会新建 xhr，上一轮迟到的回调不得再改状态）
    var done = false;
    function finishOne() {
      if (done) return;
      done = true;
      if (item.xhr === xhr) item.xhr = null;
      uploading = false;
      render();
      uploadNext();
    }

    // 分类/文件名/相对路径放 URL query：服务端在接收请求体之前就能读到，
    // 上传记录与进度条可立即建立（multipart 字段要接收完整个请求体才能解析）。
    // 分类取入队时的快照（item.category），而非当前全局分类——排队后切换分类不应影响已入队文件
    xhr.open('POST',
      '/upload?category=' + encodeURIComponent(item.category) +
      '&filename=' + encodeURIComponent(item.file.name) +
      '&relativepath=' + encodeURIComponent(item.relPath || ''),
      true);
    // 访问码走请求头（服务端校验 X-Upload-Token）；URL query 里只放分类/文件名/相对路径
    xhr.setRequestHeader('X-Upload-Token', token);
    xhr.upload.onprogress = function (e) {
      if (item.xhr !== xhr) return;
      if (e.lengthComputable) {
        item.progress = Math.floor(e.loaded / e.total * 100);
        render();
      }
    };
    xhr.onload = function () {
      if (item.xhr !== xhr) return;
      // 403 = 访问码失效（电视端 App 重启后轮换了新码；熄屏/播放/休眠恢复不换码）
      if (xhr.status === 403) {
        item.status = 'err';
        authLost();
        finishOne();
        return;
      }
      var okStatus = xhr.status >= 200 && xhr.status < 300;
      item.status = okStatus ? 'ok' : 'err';
      var resp = null;
      try { resp = JSON.parse(xhr.responseText); } catch (_) {}
      if (item.status === 'err') {
        toast('「' + item.name + '」上传失败：' + ((resp && resp.message) || '未知错误'));
      } else if (resp && resp.message) {
        // 电视端回传的处理结果：压缩包解压成功 / 未找到对应文件 / 空间不足等
        toast('「' + item.name + '」' + resp.message);
      }
      finishOne();
    };
    xhr.onerror = function () {
      if (item.xhr !== xhr) return;
      item.status = 'err';
      // 服务端在读完请求体之前就回了 403 并关掉连接时，浏览器报的是网络错误而不是 403
      // （大文件尤其明显）。用一次 /verify 探针把「访问码失效」和「真连不上」分开，
      // 否则电视 App 重启换码后用户只会看到「服务器可能已休眠」，永远不知道该重新输入访问码。
      if (token) probeAuth(item, finishOne);
      else {
        toast('连接失败：电视端服务器可能已休眠或正在播放视频，请在电视「上传」页唤醒/等待恢复后重试');
        finishOne();
      }
    };
    // 用户点「取消」：直接断开连接，已传的部分作废（电视端该条上传记录会记为失败）
    xhr.onabort = function () {
      if (item.xhr !== xhr) return;
      item.status = 'cancel';
      toast('已取消「' + item.name + '」');
      finishOne();
    };
    xhr.send(form);
  }

  // ——— 启动：决定进上传界面还是访问码门槛 ———
  // 情况 A：扫码进入（URL 带 token）→ 自动取用，用户完全无感；
  // 情况 B：手动输入 IP 进入（URL 无 token）→ 显示「输入访问码」界面。
  // 补充一条：URL 无 token 但本标签页已验证过（用户按了刷新）→ 复用 sessionStorage，不必重复输入。
  var urlToken = '';
  try { urlToken = normalizeToken(new URLSearchParams(location.search).get('token')); } catch (_) {}
  if (urlToken) {
    storeToken(urlToken);
    // 把访问码从地址栏抹掉：① 避免刷新/收藏/转发时带着一个可能已失效的码反复进入上传界面；
    // ② 避免访问码随 URL 泄露给被转发到的其他设备
    try { if (location.search) history.replaceState(null, '', location.pathname); } catch (_) {}
    showApp();
  } else {
    var reused = readStoredToken();
    if (reused) { token = reused; showApp(); } else { showGate(''); }
  }

  // ——— 服务器连通性 ———
  fetch('/').then(function (res) {
    $('badge').textContent = '已连接';
  }).catch(function () {
    $('badge').textContent = '未连接';
    $('badge').classList.add('off');
  });
})();
</script>
</body>
</html>
